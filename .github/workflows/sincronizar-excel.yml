name: Sincronizar catálogo desde Google Drive

# Baja la Google Sheet "listado-precios", regenera productos.json y, si hubo
# cambios, los sube al repositorio. GitHub Pages se vuelve a publicar sola.
#
# Se activa por tres vías:
#   1) schedule: cada 15 minutos como respaldo si no llega el aviso de la planilla.
#   2) workflow_dispatch: botón "Run workflow" en la pestaña Actions para
#      sincronizar inmediatamente.
#   3) repository_dispatch: la propia Google Sheet dispara la sincronización
#      al editarla, vía el script en apps-script/disparar-sincronizacion.gs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [actualizar-catalogo]
  push:
    branches: [main]
    paths:
      - generar_catalogo.py
      - script.js
      - index.html
      - .github/workflows/sincronizar-excel.yml
      - apps-script/disparar-sincronizacion.gs

permissions:
  contents: write
  pages: write

# Evita corridas superpuestas
concurrency:
  group: sincronizar-drive
  cancel-in-progress: true

env:
  CARPETA_DRIVE: "https://drive.google.com/drive/folders/1deN3y9wsatVuNk_coG9nMWe2F0P_7Qv_"
  # ID de la Google Sheet "listado-precios": es la planilla que se edita a mano.
  # Se baja directo por ID para no depender de qué archivos haya en la carpeta.
  SHEET_ID: "1y3e341bygLkaqV_iVSipuS90O66rWvqtw2grXOjYhZs"

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl gdown

      - name: Bajar la planilla desde Google Drive
        run: |
          set -e
          rm -rf drive_tmp
          mkdir -p drive_tmp

          # 1) Opción principal: exportar la Google Sheet directo por su ID.
          #    Así siempre se baja la planilla que se edita a mano (la más nueva).
          curl -sSL --fail --max-time 60 \
            -o drive_tmp/listado-precios.xlsx \
            "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx" || true

          # Un .xlsx real es un zip: empieza con "PK". Si no, la exportación falló
          # (p. ej. la planilla no está compartida como "cualquier persona con el enlace").
          if [ "$(head -c2 drive_tmp/listado-precios.xlsx 2>/dev/null)" != "PK" ]; then
            echo "::warning::La exportación directa falló; se intenta bajando la carpeta completa con gdown."
            rm -f drive_tmp/*.xlsx
            gdown "$CARPETA_DRIVE" -O drive_tmp || true
          fi

          echo "Contenido descargado:"
          find drive_tmp -type f 2>/dev/null || echo "(sin archivos)"
          # Elegimos el .xlsx más reciente (por si la carpeta trae más de uno)
          XLSX=$(find drive_tmp -name "*.xlsx" -printf "%T@ %p\n" 2>/dev/null | sort -rn | head -n1 | cut -d" " -f2-)
          if [ -z "$XLSX" ] || [ "$(head -c2 "$XLSX" 2>/dev/null)" != "PK" ]; then
            echo "::error::No se pudo bajar ningún .xlsx válido de Drive. Revisá que la planilla esté compartida con 'Cualquier persona con el enlace'."
            exit 1
          fi
          echo "Usando la planilla: $XLSX"
          mkdir -p EXCELL
          rm -f EXCELL/*.xlsx
          cp "$XLSX" "EXCELL/listado-actualizado.xlsx"

      - name: Regenerar productos.json desde el Excel
        run: python generar_catalogo.py EXCELL/listado-actualizado.xlsx

      - name: Subir cambios al repositorio
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # SOLO se sube productos.json. El .xlsx que exporta Google cambia de
          # bytes en cada descarga aunque los datos sean idénticos, así que
          # commitearlo generaría "cambios" basura en cada corrida.
          git add productos.json
          if git diff --cached --quiet; then
            echo "Sin cambios: la página ya está al día."
            exit 0
          fi
          git commit -m "Actualización automática desde Google Drive ($(date -u +'%d/%m/%Y %H:%M UTC'))"
          # Reintentamos el push ante un push concurrente (p. ej. un commit manual)
          for intento in 1 2 3; do
            if git push; then
              echo "Cambios subidos al repositorio."
              exit 0
            fi
            echo "Push rechazado (intento $intento). Reintentando..."
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::No se pudo subir los cambios tras 3 intentos."
          exit 1

      - name: Forzar la publicación en GitHub Pages
        run: |
          # Los pushes hechos con GITHUB_TOKEN no disparan solos la publicación,
          # así que la pedimos por API (por eso el workflow pide permiso pages: write).
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          echo "Publicación solicitada."

